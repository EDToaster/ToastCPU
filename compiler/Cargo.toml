[package]
name = "tlc"
version = "0.1.0"
edition = "2021"

# The compiler package exposes the reusable frontend as a library (`tlc`) and
# keeps the `tlc` binary as a thin CLI wrapper on top of it.
[lib]
name = "tlc"
path = "src/lib.rs"

[[bin]]
name = "tlc"
path = "src/main.rs"

[dependencies]
lrlex.workspace = true
lrpar.workspace = true
cfgrammar.workspace = true
argparse.workspace = true
colored = "2.0.0"
lazy_static = "1.4.0"
regex = "1.7.0"
once_cell = "1.17.0"
itertools = "0.10.5"

[build-dependencies]
lrlex.workspace = true
lrpar.workspace = true
cfgrammar.workspace = true
