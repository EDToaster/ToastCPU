[package]
name = "emu"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1.6.0"
crossterm = "0.23"
ringbuffer = "0.11.1"

argparse.workspace = true

# jit stuff
libc = "0.2.139"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# NOTE: the release profile lives in the workspace root Cargo.toml (profiles are
# only honored there), and keeps opt-level = 3 for the emulator's JIT.
